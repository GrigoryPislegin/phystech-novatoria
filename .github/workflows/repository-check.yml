name: Repository checks
on:
  push:
    branches: [main, 'codex/**', 'feature/**']
  pull_request:
permissions:
  contents: read
jobs:
  static-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python scripts/check_repository.py
      - run: python -m unittest discover -s tests -v
  prototype-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r prototype/requirements.lock.txt
      - run: python -m pip check
      # No secrets or paid model calls. NER acceptance tests explicitly skip if
      # public weights are absent; local/Docker checks cover the real NER path.
      - run: python -m unittest discover -s prototype/tests -v
      - run: node --version && node --test prototype/tests/test_web_*.cjs
