syntax = "proto3";

package platform_api.v1;

import "google/protobuf/timestamp.proto";
import "platform_api/v1/common.proto";

service VacancyService {
  rpc CreateVacancy(CreateVacancyRequest) returns (CreateVacancyResponse);
  rpc ReadVacancy(ReadVacancyRequest) returns (ReadVacancyResponse);
  rpc UpdateVacancy(UpdateVacancyRequest) returns (UpdateVacancyResponse);
  rpc DeleteVacancy(DeleteVacancyRequest) returns (DeleteVacancyResponse);

  rpc ReadManyVacanciesByProject(ReadManyVacanciesByProjectRequest) returns (ReadManyVacanciesByProjectResponse);
}

enum VacancyStatus {
  VACANCY_STATUS_UNSPECIFIED = 0;
  VACANCY_STATUS_OPEN = 1;
  VACANCY_STATUS_ARCHIVED = 2;
}

enum VacancySchedule {
  VACANCY_SCHEDULE_UNSPECIFIED = 0;
  VACANCY_SCHEDULE_6_1 = 1;
  VACANCY_SCHEDULE_5_2 = 2;
  VACANCY_SCHEDULE_4_3 = 3;
  VACANCY_SCHEDULE_3_3 = 4;
  VACANCY_SCHEDULE_3_2 = 5;
  VACANCY_SCHEDULE_2_2 = 6;
  VACANCY_SCHEDULE_2_1 = 7;
  VACANCY_SCHEDULE_1_1 = 8;
}

enum VacancyExperience {
  VACANCY_EXPERIENCE_UNSPECIFIED = 0;
  VACANCY_EXPERIENCE_NO = 1;
  VACANCY_EXPERIENCE_1_3 = 2;
  VACANCY_EXPERIENCE_3_6 = 3;
  VACANCY_EXPERIENCE_6_PLUS = 4;
}

enum VacancyWorkFormat {
  VACANCY_WORK_FORMAT_UNSPECIFIED = 0;
  VACANCY_WORK_FORMAT_OFFICE = 1;
  VACANCY_WORK_FORMAT_REMOTE = 2;
  VACANCY_WORK_FORMAT_HYBRID = 3;
  VACANCY_WORK_FORMAT_TRAVEL = 4;
}

enum VacancyWorkType {
  VACANCY_WORK_TYPE_UNSPECIFIED = 0;
  VACANCY_WORK_TYPE_FULL_TIME = 1;
  VACANCY_WORK_TYPE_PART_TIME = 2;
  VACANCY_WORK_TYPE_PROJECT = 3;
  VACANCY_WORK_TYPE_SHIFT = 4;
}

enum VacancyPublicationStatus {
  VACANCY_PUBLICATION_STATUS_UNSPECIFIED = 0;
  VACANCY_PUBLICATION_STATUS_NOT_PUBLISHED = 1;
  VACANCY_PUBLICATION_STATUS_SUBMITTED = 2;
  VACANCY_PUBLICATION_STATUS_PROCESSED = 3;
  VACANCY_PUBLICATION_STATUS_PUBLISHED = 4;
}

enum VacancyPublicationSource {
  VACANCY_PUBLICATION_SOURCE_UNSPECIFIED = 0;
  VACANCY_PUBLICATION_SOURCE_HH = 1;
  VACANCY_PUBLICATION_SOURCE_AVITO = 2;
}

message SalaryAmountRange {
  // currency in ISO 4217 format, e.g. "RUB"
  string currency = 1;
  // minimum salary
  optional int64 min = 2;
  // maximum salary
  optional int64 max = 3;
}

message VacancyStageStatus {
  VacancyStage stage = 1;
  bool shown = 2;
}

message VacancyStatistics {
  int32 total_candidates = 1;
  int32 platform_candidates = 2;
  int32 delegated_candidates = 3;
}

message Vacancy {
  // VacancyID
  string id = 1;
  // UserID
  string user_id = 2;
  // ProjectID
  string project_id = 3;

  string title = 4;
  string description = 5;
  string specialization = 6;
  string thumbnail_url = 7;

  VacancyStatus status = 8;

  optional string city = 9;
  optional string country = 10;

  optional int32 hire_amount = 11;
  optional SalaryAmountRange salary = 12;

  VacancyWorkType work_type = 13;
  repeated VacancyWorkFormat work_format = 14;

  bool is_internship = 15;
  bool is_temphire = 16;

  repeated VacancySchedule schedule = 17;
  // how many hours per day, multi-choice
  repeated int32 daily_rate = 18;

  VacancyExperience experience = 19;

  repeated Skill skills = 20;

  repeated VacancyStageStatus stages = 21;

  VacancyStatistics statistics = 23;

  // vacancy threshold for approving candidates in [0;1]
  double threshold = 24;

  google.protobuf.Timestamp created_at = 100;
  google.protobuf.Timestamp updated_at = 101;
  optional google.protobuf.Timestamp deleted_at = 102;
}

message CreateVacancyRequest {
  // UserID
  string user_id = 1;
  // ProjectID
  string project_id = 2;

  string title = 3;
  string description = 4;
  string specialization = 5;

  VacancyStatus status = 6;

  optional string city = 7;
  optional string country = 8;

  optional int32 hire_amount = 9;
  optional SalaryAmountRange salary = 10;
  VacancyWorkType work_type = 11;
  repeated VacancyWorkFormat work_format = 12;

  bool is_internship = 13;
  bool is_temphire = 14;

  repeated VacancySchedule schedule = 15;
  repeated int32 daily_rate = 16;

  VacancyExperience experience = 17;

  repeated Skill skills = 18;

  double threshold = 21;
}

message CreateVacancyResponse {
  Vacancy vacancy = 1;
}

message ReadVacancyRequest {
  // VacancyID
  string id = 1;
}

message ReadVacancyResponse {
  Vacancy vacancy = 1;
}

message DeleteVacancyRequest {
  // VacancyID
  string id = 1;
}

message DeleteVacancyResponse {
  Vacancy vacancy = 1;
}

message ReadManyVacanciesByProjectRequest {
  // ProjectID
  string project_id = 1;
}

message ReadManyVacanciesByProjectResponse {
  repeated Vacancy items = 1;
}

message ReadManyPublishedVacanciesRequest {
  VacancyPublicationSource source = 1;
}

message ReadManyPublishedVacanciesResponse {
  repeated Vacancy items = 1;
}

message UpdateVacancyRequest {
  // VacancyID
  string id = 1;

  optional PatchString title = 2;
  optional PatchString description = 3;
  optional PatchString specialization = 4;
  optional PatchString thumbnail_url = 5;
  optional PatchVacancyStatus status = 6;
  optional PatchOptionalString city = 7;
  optional PatchOptionalString country = 8;
  optional PatchOptionalInt32 hire_amount = 9;
  optional PatchSalaryAmountRange salary = 10;
  optional PatchVacancyWorkType work_type = 11;
  optional PatchVacancyWorkFormat work_format = 12;
  optional PatchBool is_internship = 13;
  optional PatchBool is_temphire = 14;
  optional PatchVacancySchedule schedule = 15;
  optional PatchFloat64 threshold = 16;
  optional PatchVacancyExperience experience = 17;
  optional PatchRepeatedSkill skills = 18;
  optional PatchRepeatedVacancyStageStatus stages = 19;

  message PatchVacancyStatus {
    VacancyStatus new_value = 1;
  }

  message PatchSalaryAmountRange {
    SalaryAmountRange new_value = 1;
  }

  message PatchVacancyWorkType {
    VacancyWorkType new_value = 1;
  }

  message PatchVacancyWorkFormat {
    VacancyWorkFormat new_value = 1;
  }

  message PatchVacancySchedule {
    VacancySchedule new_value = 1;
  }

  message PatchVacancyExperience {
    VacancyExperience new_value = 1;
  }

  message PatchRepeatedSkill {
    repeated Skill new_value = 1;
  }

  message PatchRepeatedVacancyStageStatus {
    repeated VacancyStageStatus new_value = 1;
  }
}

message UpdateVacancyResponse {
  Vacancy vacancy = 1;
}
