syntax = "proto3";

package platform_api.v1;

enum VacancyStage {
  VACANCY_STAGE_UNSPECIFIED = 0;
  VACANCY_STAGE_MAGIC_AI = 1;
  VACANCY_STAGE_SELECTED_AI = 2;
  VACANCY_STAGE_SELECTED_USER = 3;
  VACANCY_STAGE_MESSAGE = 4;
  VACANCY_STAGE_PRELIMINARY_CALL = 5;
  VACANCY_STAGE_INTERVIEW = 6;
  VACANCY_STAGE_TEST_TASK = 7;
  VACANCY_STAGE_FINAL_TEST = 8;
  VACANCY_STAGE_ACCEPTED = 9;
  VACANCY_STAGE_REJECTED_AI = 10;
  VACANCY_STAGE_OFFER = 11;
  VACANCY_STAGE_REJECTED_USER = 12;
}

message Skill {
  // skill title in a free form. head hunter compatibility is preferred
  string title = 1;
}

message PatchString {
  string new_value = 1;
}

message PatchOptionalString {
  optional string new_value = 1;
}

message PatchInt32 {
  int32 new_value = 1;
}

message PatchOptionalInt32 {
  optional int32 new_value = 1;
}

message PatchBool {
  bool new_value = 1;
}

message PatchMapStringString {
  map<string, string> new_value = 1;
}

message PatchFloat64 {
  double new_value = 1;
}
