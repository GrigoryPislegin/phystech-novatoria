syntax = "proto3";

package platform_api.v1;

import "google/protobuf/timestamp.proto";
import "platform_api/v1/common.proto";

service CriterionService {
  rpc CreateCriterion(CreateCriterionRequest) returns (CreateCriterionResponse);
  rpc CreateManyCriteria(CreateManyCriteriaRequest) returns (CreateManyCriteriaResponse);
  rpc ReadCriterion(ReadCriterionRequest) returns (ReadCriterionResponse);
  rpc UpdateCriterion(UpdateCriterionRequest) returns (UpdateCriterionResponse);
  rpc DeleteCriterion(DeleteCriterionRequest) returns (DeleteCriterionResponse);
  rpc ReadManyCriteriaByVacancy(ReadManyCriteriaByVacancyRequest) returns (ReadManyCriteriaByVacancyResponse);
}

message CriterionPayload {
  string criterion = 1;
  int32 initial_weight = 2;
}

message Criterion {
  // CriterionID
  string id = 1;
  // UserID
  string user_id = 2;
  // ProjectID
  string project_id = 3;
  // VacancyID
  string vacancy_id = 4;
  // criterion text
  string criterion = 5;
  // >= 0
  int32 initial_weight = 6;

  google.protobuf.Timestamp created_at = 100;
  google.protobuf.Timestamp updated_at = 101;
  optional google.protobuf.Timestamp deleted_at = 102;
}

message CreateCriterionRequest {
  string user_id = 1;
  string project_id = 2;
  string vacancy_id = 3;

  string criterion = 4;
  int32 initial_weight = 5;
}

message CreateCriterionResponse {
  Criterion criterion = 1;
}

message CreateManyCriteriaRequest {
  string user_id = 1;
  string project_id = 2;
  string vacancy_id = 3;

  repeated CriterionPayload criteria = 4;
}

message CreateManyCriteriaResponse {
  repeated string criterion_ids = 1;
}

message ReadCriterionRequest {
  string id = 1;
}

message ReadCriterionResponse {
  Criterion criterion = 1;
}

message DeleteCriterionRequest {
  string id = 1;
}

message DeleteCriterionResponse {
  Criterion criterion = 1;
}

message ReadManyCriteriaByVacancyRequest {
  string vacancy_id = 1;
}

message ReadManyCriteriaByVacancyResponse {
  repeated Criterion items = 1;
}

message UpdateCriterionRequest {
  string id = 1;

  optional PatchString criterion = 2;
  optional PatchInt32 initial_weight = 3;
}

message UpdateCriterionResponse {
  Criterion criterion = 1;
}
