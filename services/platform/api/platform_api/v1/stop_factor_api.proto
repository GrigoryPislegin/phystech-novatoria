syntax = "proto3";

package platform_api.v1;

import "google/protobuf/timestamp.proto";
import "platform_api/v1/common.proto";

service StopFactorService {
  rpc CreateStopFactor(CreateStopFactorRequest) returns (CreateStopFactorResponse);
  rpc CreateManyStopFactors(CreateManyStopFactorsRequest) returns (CreateManyStopFactorsResponse);
  rpc ReadStopFactor(ReadStopFactorRequest) returns (ReadStopFactorResponse);
  rpc UpdateStopFactor(UpdateStopFactorRequest) returns (UpdateStopFactorResponse);
  rpc DeleteStopFactor(DeleteStopFactorRequest) returns (DeleteStopFactorResponse);
  rpc ReadManyStopFactorsByVacancy(ReadManyStopFactorsByVacancyRequest) returns (ReadManyStopFactorsByVacancyResponse);
}

message StopFactorPayload {
  string stop_factor = 1;
  int32 initial_weight = 2;
}

message StopFactor {
  // StopFactorID
  string id = 1;
  // UserID
  string user_id = 2;
  // ProjectID
  string project_id = 3;
  // VacancyID
  string vacancy_id = 4;
  string stop_factor = 5;
  int32 initial_weight = 6;

  google.protobuf.Timestamp created_at = 100;
  google.protobuf.Timestamp updated_at = 101;
  optional google.protobuf.Timestamp deleted_at = 102;
}

message CreateStopFactorRequest {
  string user_id = 1;
  string project_id = 2;
  string vacancy_id = 3;

  string stop_factor = 4;
  int32 initial_weight = 5;
}

message CreateStopFactorResponse {
  StopFactor stop_factor = 1;
}

message CreateManyStopFactorsRequest {
  string user_id = 1;
  string project_id = 2;
  string vacancy_id = 3;

  repeated StopFactorPayload stop_factors = 4;
}

message CreateManyStopFactorsResponse {
  repeated string stop_factor_ids = 1;
}

message ReadStopFactorRequest {
  string id = 1;
}

message ReadStopFactorResponse {
  StopFactor stop_factor = 1;
}

message DeleteStopFactorRequest {
  string id = 1;
}

message DeleteStopFactorResponse {
  StopFactor stop_factor = 1;
}

message ReadManyStopFactorsByVacancyRequest {
  string vacancy_id = 1;
}

message ReadManyStopFactorsByVacancyResponse {
  repeated StopFactor items = 1;
}

message UpdateStopFactorRequest {
  string id = 1;

  optional PatchString stop_factor = 2;
  optional PatchInt32 initial_weight = 3;
}

message UpdateStopFactorResponse {
  StopFactor stop_factor = 1;
}
