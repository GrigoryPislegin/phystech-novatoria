syntax = "proto3";

package platform_api.v1;

import "google/protobuf/timestamp.proto";
import "platform_api/v1/common.proto";

service ProjectService {
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  rpc ReadProject(ReadProjectRequest) returns (ReadProjectResponse);
  rpc UpdateProject(UpdateProjectRequest) returns (UpdateProjectResponse);
  rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse);

  rpc ReadManyProjectsByUser(ReadManyProjectsByUserRequest) returns (ReadManyProjectsByUserResponse);
}

message ProjectTemplateSettings {
  // URL to image logo
  optional string logo_url = 1;
  // logo format
  optional string logo_format = 2;
  // main color in hex without prefix (e.g. "FF0000")
  optional string main_color = 3;
  // True if don't use nanimai attributes
  bool without_nanimai_attributes = 4;
}

message ProjectStatistics {
  // number of candidates
  int32 total_candidates = 1;
  // number of vacancies
  int32 total_vacancies = 2;
  // number of active vacancies
  int32 active_vacancies = 3;
}

// =============================
// DOMAIN MODEL
// =============================

message Project {
  // ProjectID
  string id = 1;
  // UserID (project owner)
  string user_id = 2;

  string title = 3;
  optional string description = 4;
  string thumbnail_url = 5;

  ProjectStatistics statistics = 6;
  ProjectTemplateSettings template_settings = 7;

  google.protobuf.Timestamp created_at = 100;
  google.protobuf.Timestamp updated_at = 101;
  optional google.protobuf.Timestamp deleted_at = 102;
}

message CreateProjectRequest {
  // UserID
  string user_id = 1;
  string title = 2;
  optional string description = 3;
}

message CreateProjectResponse {
  Project project = 1;
}

message ReadProjectRequest {
  // ProjectID
  string id = 1;
}

message ReadProjectResponse {
  Project project = 1;
}

message DeleteProjectRequest {
  // ProjectID
  string id = 1;
}

message DeleteProjectResponse {
  Project project = 1;
}

message ReadManyProjectsByUserRequest {
  // UserID
  string user_id = 1;
}

message ReadManyProjectsByUserResponse {
  repeated Project items = 1;
}

message UpdateProjectRequest {
  // ProjectID
  string id = 1;

  optional PatchString title = 2;
  optional PatchOptionalString description = 3;
  optional PatchString thumbnail_url = 4;
}

message UpdateProjectResponse {
  Project project = 1;
}
