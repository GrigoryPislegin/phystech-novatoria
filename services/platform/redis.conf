# Redis configuration optimized for high throughput

# Network and connection settings
bind 0.0.0.0
port 6379
tcp-backlog 511
tcp-keepalive 300
timeout 0

# Memory management
maxmemory 2gb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Performance tuning
# Disable protected mode for Docker environment
protected-mode no

# Save settings - optimize for performance over durability
# Comment out all save directives for maximum performance
# save 900 1
# save 300 10
# save 60 10000
save ""

# AOF (Append Only File) settings - disabled for maximum performance
appendonly no
appendfsync no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Slow log settings
slowlog-log-slower-than 10000
slowlog-max-len 128

# Client settings
maxclients 10000

# Memory optimization
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
hll-sparse-max-bytes 3000

# Streams settings
stream-node-max-bytes 4096
stream-node-max-entries 100

# Threading (Redis 6.0+)
# Enable I/O threading for better performance
io-threads 4
io-threads-do-reads yes

# Lazy freeing
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# Disable logging to improve performance
loglevel warning
logfile ""

# Disable RDB checksums for better performance
rdbchecksum no

# TCP settings for better network performance
tcp-keepalive 60

# Disable disk persistence warnings
stop-writes-on-bgsave-error no

# Optimize memory usage
activerehashing yes
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Disable unused features
notify-keyspace-events ""

# Optimize for high throughput
hz 10
dynamic-hz yes
