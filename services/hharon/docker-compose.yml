networks:
  nanimai-network:
    external: true

  hharon-network:
    driver: bridge

services:
  hharon_server:
    build:
      context: .
      dockerfile: dockerfile
    container_name: hharon-server
    restart: unless-stopped
    volumes:
      - ./config.toml:/app/config.toml
    ports:
      - 127.0.0.1:50054:50054
    command: ["uv", "-q", "run", "python3", "-m", "hharon", "server"]
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:50054"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nanimai-network
      - hharon-network
    depends_on:
      hharon_postgres:
        condition: service_healthy
      hharon_valkey:
        condition: service_healthy
      hharon_rabbitmq:
        condition: service_healthy

  hharon_valkey:
    image: valkey/valkey:latest
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      start_period: 5s
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - hharon-network

  hharon_postgres:
    image: postgres:17-alpine
    environment:
      PG_APP_USERNAME: ${PG_APP_USERNAME:-hharon}
      PG_APP_PASSWORD: ${PG_APP_PASSWORD:-hharon}
      PG_APP_DATABASE: ${PG_APP_DATABASE:-hharon}
      POSTGRES_USER: ${PG_ADM_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${PG_ADM_PASSWORD:-postgres}
      POSTGRES_DB: ${PG_ADM_DATABASE:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./hharon/infra/postgres_init.sh:/docker-entrypoint-initdb.d/init.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 60s
      timeout: 5s
      retries: 5
    networks:
      - hharon-network

  hharon_rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: hharon-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-rabbitmq}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-rabbitmq}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - hharon-network
      - nanimai-network

volumes:
  postgres-data:
    driver: local
